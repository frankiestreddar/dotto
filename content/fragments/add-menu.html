<div id="add-menu">
    <div id="add-menu-tabs">
        <div class="add-tab" data-tab="notes" onclick="switchAddTab('notes')" onmouseenter="switchAddTab('notes')">Notes</div>
        <div class="add-tab" data-tab="tools" onclick="switchAddTab('tools')" onmouseenter="switchAddTab('tools')">Tools</div>
        <div class="add-tab" data-tab="utilities" onclick="switchAddTab('utilities')" onmouseenter="switchAddTab('utilities')">Utilities</div>
        <div class="add-tab" data-tab="games" onclick="switchAddTab('games')" onmouseenter="switchAddTab('games')">Games</div>
        <div class="add-tab" data-tab="stats" onclick="switchAddTab('stats')" onmouseenter="switchAddTab('stats')">Stats</div>
        <input id="add-menu-search-input" type="text" placeholder="Search blocks…" oninput="handleAddMenuSearchInput(this.value)">
        <div id="add-menu-search-btn" class="add-tab" title="Search block types" onclick="toggleAddMenuSearch()">
            <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5"></circle><path d="M17 17l-4-4"></path></svg>
        </div>
    </div>
    <div id="add-menu-list"></div>
    <div id="add-menu-actions">
        <div class="add-tab add-menu-action-btn" title="New Canvas" onclick="prepareAdd('folder')"><img src="/assets/icons/canvas.png" alt=""></div>
        <div class="add-tab add-menu-action-btn" title="New Source" onclick="newSourceClicked()"><img src="/assets/icons/source.png" alt=""></div>
    </div>
</div>
