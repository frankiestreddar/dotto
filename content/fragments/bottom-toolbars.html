<div id="bottom-toolbars">
    <div class="toolbar" id="mode-toolbar">
        <button class="btn mode-btn mode-visible active" data-mode="normal" title="Move & select (default cursor) — tap Escape, hold for temporary">
            <svg viewBox="0 0 16 16" fill="currentColor"><path d="M3 1.5L13 8L8.2 9.1L6.2 14L3 1.5Z"/></svg>
        </button>
        <button class="btn mode-btn" data-mode="data" title="Data mode — drag from one card to another to link them — tap D, hold for temporary">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><circle cx="3.3" cy="3.3" r="1.9"/><circle cx="12.7" cy="12.7" r="1.9"/><path d="M4.7 4.7L11.3 11.3"/></svg>
        </button>
        <button class="btn mode-btn" data-mode="select" title="Select mode — click or drag to select multiple cards — tap Shift, hold for temporary">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-dasharray="2.2 1.8"><rect x="2.2" y="2.2" width="11.6" height="11.6" rx="1.5"/></svg>
        </button>
    </div>
    <div class="toolbar" id="add-toolbar">
        <button id="btn-add" class="btn" title="Add"><img src="/assets/icons/add-btn.png" alt=""></button>
    </div>
    <div class="toolbar" id="schedule-toolbar">
        <button id="btn-schedule" class="btn" title="Schedule"><img src="/assets/icons/schedule-btn.png" alt=""></button>
    </div>
</div>
