<div id="canvas">
    <div id="dot-layer"></div>
    <div id="world">
        <!-- React-owned portal target for canvas item cards (see app/dotto/CanvasItemsLayer.jsx).
             Deliberately left unstyled (no position/transform) so .item's position:absolute still
             resolves against #world, not this wrapper — see PHASE2_ROADMAP.md's canvas-items-react
             plan. render() (waypoints-render-loop.js) never removes this node; it only rebuilds the
             non-item layers (drawings/connections SVG) around it. -->
        <div id="items-layer"></div>
    </div>
    <!-- Live collaborator cursors (see ensureCanvasPresenceChannel/render() in dotto-script.js) —
         a sibling of #world, never inside it, since #world's non-item children (everything except
         #items-layer) are fully wiped and rebuilt on every render() call and these need to survive
         that. -->
    <div id="cursor-overlay"></div>
    <div id="schedule-view">
        <div id="schedule-view-header">
            <div class="schedule-nav-card">
                <button class="schedule-nav-card-btn" title="Back 1 month" onclick="scheduleAgendaShift('month', -1)">‹‹‹</button>
                <button class="schedule-nav-card-btn" title="Back 1 week" onclick="scheduleAgendaShift('week', -1)">‹‹</button>
                <button class="schedule-nav-card-btn" title="Back 1 day" onclick="scheduleAgendaShift('day', -1)">‹</button>
            </div>
            <div id="schedule-view-date"></div>
            <div class="schedule-nav-card">
                <button class="schedule-nav-card-btn" title="Forward 1 day" onclick="scheduleAgendaShift('day', 1)">›</button>
                <button class="schedule-nav-card-btn" title="Forward 1 week" onclick="scheduleAgendaShift('week', 1)">››</button>
                <button class="schedule-nav-card-btn" title="Forward 1 month" onclick="scheduleAgendaShift('month', 1)">›››</button>
            </div>
        </div>
        <div id="schedule-view-canvas">
            <div id="schedule-view-inner">
                <div id="schedule-view-hours"></div>
                <div id="schedule-view-stack"></div>
            </div>
        </div>
    </div>
</div>
