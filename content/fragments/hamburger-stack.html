<!-- Hamburger Panels (stacked) — each is now its own rail icon's view (see #dotto-rail, top-bar.html,
     and openRailView/wireRailIcon, panels-hamburger.js), not reached via an account-menu row
     anymore. Waypoints/Collaborations/Marketplace/Messages/Profile/AI-search all share this one
     shell, swapping which section is .open. -->
<div id="hamburger-stack">
    <div id="outline-menu" class="hmenu-panel">
        <div id="hmenu-outline-container"></div>
    </div>
    <div id="hub-collab-panel" class="hmenu-panel hub-subpanel" onclick="event.stopPropagation()">
        <div class="hub-subpanel-search-wrap">
            <input id="hub-collab-search" class="hub-subpanel-search" type="text" placeholder="Search..." oninput="handleHubCollabSearch(this.value)">
        </div>
        <div id="hub-collab-list" class="hub-subpanel-list"></div>
    </div>
    <div id="waypoints-panel" class="hmenu-panel hub-subpanel" onclick="event.stopPropagation()">
        <div class="hub-subpanel-search-wrap">
            <input id="waypoints-search" class="hub-subpanel-search" type="text" placeholder="Search..." oninput="handleWaypointsSearch(this.value)">
        </div>
        <div id="waypoints-list" class="hub-subpanel-list"></div>
    </div>
    <!-- AI search — moved here from its own standalone modal overlay (content/fragments/
         search-overlay.html, now empty/unused) now that it shares this permanent rail shell (see
         openRailView('ai', ...) wiring, ai-assistant-suggestions.js). No more dimming backdrop —
         this is an embedded panel like every other rail view, not a modal. Two internal views, not
         top-level rail views of their own: the active chat (#ai-chat-view, default) and a
         chat-history list (#ai-history-view, "New chat" pinned above the list) — toggled by each
         view's own "←" header button (showAiHistoryView/showAiChatView, ai-assistant-
         suggestions.js), independent of the outer rail's own open/close state. Everything inside
         #search-chat-thread/#search-input-wrap/#search-dropdown is otherwise unchanged from when
         it lived in the modal — every result panel still portals into a static node by id
         (usePortalNode), so moving this subtree here didn't require touching that store/portal
         wiring. -->
    <div id="ai-panel" class="hmenu-panel hub-subpanel" onclick="event.stopPropagation()">
        <div id="ai-chat-view">
            <div id="ai-chat-header">
                <button id="ai-history-btn" title="Chat history" onclick="event.stopPropagation(); showAiHistoryView();">←</button>
            </div>
            <div id="search-chat-thread"></div>
            <div id="search-dropdown">
                <!-- Slash-command live suggestions (see command-palette.js) — first, so it visually
                     leads whenever there's a "/" command being typed rather than appearing after
                     unrelated search-result panels. -->
                <div id="search-command-palette"></div>
                <div id="search-dotbot-answer"></div>
                <div id="search-results"></div>
                <div id="search-translation"></div>
                <div id="search-dictionary"></div>
                <div id="search-examples"></div>
                <div id="search-recommended"></div>
                <!-- The mnemonic story lands in #search-suggestions above (see
                     renderMnemonicResultCard) — this stays LAST so its image always renders below
                     that text, never above it. -->
                <div id="search-suggestions"></div>
                <div id="search-image-result"></div>
            </div>
            <!-- Last child, not third — pinned to the panel's bottom edge (margin-top:auto, see
                 globals.css) so the box sits at the bottom like a normal chat input, with the
                 thread/dropdown above filling upward instead of leaving empty space below an
                 input parked near the top. -->
            <div id="search-input-wrap">
                <svg id="search-input-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><circle cx="7" cy="7" r="5"></circle><path d="M11 11L14.5 14.5"></path></svg>
                <textarea id="search-input" rows="1" placeholder="" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" oninput="handleSearchInput(this.value)" onfocus="handleSearchFocus()"></textarea>
                <svg id="search-loading-ring" aria-hidden="true">
                    <rect class="search-loading-ring-base"></rect>
                    <rect class="search-loading-ring-chase" pathLength="100"></rect>
                    <!-- Idle (focused, not yet submitted) state — see handleSearchFocus/searchInputWrap's
                         .idle-pulsing toggle. Four copies of the same eased lap, phase-shifted a hair
                         apart via negative animation-delay (not a spatial offset) so they trail the
                         leader correctly even though the lap speed itself isn't constant, each a bit
                         fainter than the last for the leading-to-trailing fade. -->
                    <rect class="search-idle-chase search-idle-chase-4" pathLength="100"></rect>
                    <rect class="search-idle-chase search-idle-chase-3" pathLength="100"></rect>
                    <rect class="search-idle-chase search-idle-chase-2" pathLength="100"></rect>
                    <rect class="search-idle-chase search-idle-chase-1" pathLength="100"></rect>
                </svg>
                <div id="search-spinner" aria-hidden="true"></div>
                <div id="search-card-pill">
                    <span id="search-card-pill-label" onclick="event.stopPropagation(); openSearchCardsModal();"></span>
                    <button id="search-card-pill-clear" type="button" title="Clear attached cards" onclick="event.stopPropagation(); clearSearchCardContext();">✕</button>
                </div>
                <!-- Replaces #search-input's visible content (not its value) while a notification is
                     showing — see pushNotification/showNotification. Portal target for
                     app/dotto/NotificationBar.jsx, a real Component now — must stay an empty, unstyled
                     node so it doesn't affect #search-input-wrap's layout on its own. -->
                <div id="search-notification-root"></div>
            </div>
        </div>
        <!-- No search box for v1 (unlike waypoints-panel/hub-collab-panel above) — a saved-chat
             list is likely short enough not to need one yet; easy to add later with the same
             pattern. -->
        <div id="ai-history-view">
            <div id="ai-history-header">
                <button id="ai-history-back-btn" title="Back to chat" onclick="event.stopPropagation(); showAiChatView();">←</button>
                <button id="ai-new-chat-btn" onclick="event.stopPropagation(); startNewAiChat();">New chat</button>
            </div>
            <div id="chats-list" class="hub-subpanel-list"></div>
            <div class="hub-subpanel-footer">
                <button class="hub-subpanel-clear-all" onclick="clearAllChats()">Clear all</button>
            </div>
        </div>
    </div>
    <!-- Marketplace — moved here from its own standalone floating card (content/fragments/
         cart-panel.html, now empty/unused) now that it shares this permanent rail shell (see
         refreshCartPanel/wireRailIcon, marketplace.js). Internal Discover/Library tab-switching
         and the detail/publish-flow drill-down views are all unchanged from before. -->
    <div id="cart-panel" class="hmenu-panel hub-subpanel" onclick="event.stopPropagation()">
        <div id="cart-tabs">
            <div class="cart-tab-btn active" id="tab-discover-btn" onclick="switchCartTab('discover')">Discover</div>
            <div class="cart-tab-btn" id="tab-library-btn" onclick="switchCartTab('library')">Library</div>
        </div>

        <!-- Dynamic Drop Box Overlays on Active Template Building Drag... -->
        <div id="cart-dropzone-overlay">
            <div class="dropzone-box">
                <div class="dropzone-title">Drop cards here to create new draft</div>
                <div class="dropzone-sub">All selected nodes will be packaged beautifully as a reusable workflow snapshot template.</div>
            </div>
        </div>

        <!-- Discover View -->
        <div class="cart-view active" id="view-discover">
            <div class="marketplace-search-wrap">
                <input class="marketplace-search" id="market-search" type="text" placeholder="Search marketplace..." oninput="handleMarketplaceSearch(this.value)">
            </div>
            <div class="market-list" id="market-list-container"></div>
        </div>

        <!-- Discover Details View -->
        <div id="market-detail-view">
            <div class="p-3 border-b border-neutral-800 bg-neutral-900/40 flex items-center gap-2">
                <button onclick="closeMarketDetail()" class="text-neutral-400 hover:text-white text-xs">← Back to Discover</button>
            </div>
            <div class="detail-scroll-area" id="market-detail-content"></div>
            <div class="detail-buy-footer">
                <button class="btn-buy" id="btn-buy-action" onclick="purchaseCurrentMarketItem()">Buy Template Blueprint</button>
            </div>
        </div>

        <!-- Item Detail View: shown after dropping cards into the marketplace (an already-saved
             draft, ready to edit) and whenever a drafts/published/purchased library item is
             clicked into, to view its description + inline-canvas preview. -->
        <div id="item-detail-view">
            <div id="item-detail-header">
                <div id="item-detail-title" contenteditable="true" data-placeholder="Untitled Draft" oninput="onItemDetailFieldChange()" onblur="commitItemDetailTitle()"></div>
                <input type="text" id="item-detail-price" placeholder="$4.99" oninput="onItemDetailFieldChange()">
            </div>
            <div class="detail-scroll-area" id="item-detail-scroll">
                <div id="item-detail-canvas-wrap"></div>
                <textarea id="item-detail-desc" placeholder="Add a description..." oninput="onItemDetailFieldChange()"></textarea>
            </div>
            <div class="detail-buy-footer" id="item-detail-footer"></div>
        </div>

        <!-- Publish Flow View: reached via the Publish button on a draft's detail view. No native
             alert()/prompt() popups — this page collects the price + a short marketplace-card
             tagline before actually publishing. -->
        <div id="publish-flow-view">
            <div id="publish-flow-header">
                <div id="publish-flow-name" contenteditable="true" onmousedown="event.preventDefault(); focusPublishFlowName()" onblur="blurPublishFlowName()"></div>
                <input type="text" id="publish-flow-price" placeholder="$4.99">
            </div>
            <div class="detail-scroll-area" id="publish-flow-scroll">
                <input type="text" id="publish-flow-tagline" placeholder="Short tagline shown on marketplace cards...">
                <div id="publish-flow-canvas-wrap"></div>
                <textarea id="publish-flow-desc" placeholder="Full description..."></textarea>
            </div>
            <div class="detail-buy-footer">
                <button class="btn-buy" onclick="confirmPublishFlow()">Publish</button>
            </div>
        </div>

        <!-- Library View -->
        <div class="cart-view" id="view-library">
            <div class="library-search-wrap">
                <input class="marketplace-search" id="library-search" type="text" placeholder="Search your library..." oninput="handleLibrarySearch(this.value)">
            </div>
            <div class="library-back-row" id="library-back-row" onclick="switchLibraryFolder(null)">
                <span>←</span><span id="library-back-label">Back to folders</span>
            </div>
            <div class="library-list" id="library-list-container"></div>
        </div>
    </div>
    <!-- Messages — moved here from its own standalone floating card (content/fragments/
         messages-panel.html, now empty/unused) now that it shares this permanent rail shell (see
         refreshMessagesPanel/wireRailIcon, messages-schedule.js). Internal conversation-list vs.
         open-conversation view-toggling is all unchanged from before. -->
    <div id="messages-panel" class="hmenu-panel hub-subpanel" onclick="event.stopPropagation()">
        <div id="msg-search-wrap">
            <input id="msg-search" type="text" placeholder="Search chats or find a username..." oninput="handleMsgSearch(this.value)">
        </div>
        <div id="msg-list"></div>
        <div id="msg-convo">
            <div id="msg-convo-header">
                <button id="msg-convo-back" onclick="closeConvo()">←</button>
                <div class="msg-avatar" id="msg-convo-avatar"></div>
                <div id="msg-convo-title"></div>
            </div>
            <div id="msg-convo-body"></div>
            <div id="msg-convo-input-wrap">
                <input id="msg-convo-input" type="text" placeholder="Message..." onkeydown="if(event.key==='Enter')sendMsg();">
                <button id="msg-convo-send" onclick="sendMsg()">➤</button>
            </div>
        </div>
    </div>
    <!-- Profile — moved here from its own standalone floating card (content/fragments/
         profile-panel.html, now empty/unused) now that it shares this permanent rail shell (see
         refreshProfilePanel/openRailView, profile-achievements-pricing.js). -->
    <div id="profile-panel" class="hmenu-panel hub-subpanel" onclick="event.stopPropagation()">
        <div class="profile-block" id="profile-identity-block">
            <!-- Was a hover-swap on the rail's own #btn-profile circle (avatar → this same power
                 icon) — now a small, explicit button here instead, top-right of the identity block
                 it belongs to, rather than a destructive action hiding behind a hover state on the
                 permanent nav icon. -->
            <button id="profile-logout-btn" type="button" title="Log out" onclick="event.stopPropagation(); hmenuAction('logout');">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M12 2v10"></path>
                    <path d="M18.36 6.64a9 9 0 1 1-12.73 0"></path>
                </svg>
            </button>
            <div class="profile-avatar-lg" id="profile-avatar"></div>
            <div class="profile-identity-text">
                <div id="profile-username"></div>
                <div class="profile-level-streak-row">
                    <!-- Text content + background color are React-owned now (see
                         app/dotto/ProfileLevelPill.jsx) — the inner .profile-level-pill-text span used
                         to be static markup here; removed so the portaled one doesn't duplicate it. -->
                    <span id="profile-level-pill" class="profile-level-pill"></span>
                    <span class="profile-streak">
                        <span class="profile-streak-icon icon-mask" style="mask-image:url(/assets/icons/flame.png);-webkit-mask-image:url(/assets/icons/flame.png)"></span>
                        <span id="profile-streak-count"></span>
                    </span>
                </div>
            </div>
        </div>
        <div class="profile-block" id="profile-upgrade-block">
            <button id="profile-upgrade-btn" type="button" onclick="event.stopPropagation(); hmenuAction('upgrade');">
                <span>Try Dotto Pro</span>
                <span class="profile-upgrade-crown icon-mask" style="mask-image:url(/assets/icons/crown.png);-webkit-mask-image:url(/assets/icons/crown.png)"></span>
            </button>
        </div>
        <div class="profile-block" id="profile-usage-block">
            <div class="profile-block-content">
                <div class="profile-usage-row">
                    <div class="profile-usage-label">Block usage</div>
                    <div class="profile-usage-track"><div class="profile-usage-fill" id="profile-usage-blocks-fill"></div></div>
                    <div class="profile-usage-tooltip" id="profile-usage-blocks-tooltip"></div>
                </div>
                <div class="profile-usage-row">
                    <div class="profile-usage-label">Search usage</div>
                    <div class="profile-usage-track"><div class="profile-usage-fill" id="profile-usage-search-fill"></div></div>
                    <div class="profile-usage-tooltip" id="profile-usage-search-tooltip"></div>
                </div>
                <div class="profile-usage-row">
                    <div class="profile-usage-label">Generation usage</div>
                    <div class="profile-usage-track"><div class="profile-usage-fill" id="profile-usage-generation-fill"></div></div>
                    <div class="profile-usage-tooltip" id="profile-usage-generation-tooltip"></div>
                </div>
            </div>
            <div id="profile-usage-upgrade-hint" onclick="event.stopPropagation(); openPricingOverlay();">Upgrade for more</div>
        </div>
        <!-- Always shows the full sprite set (no compact/expand toggle) and just scrolls — fills
             whatever viewport height remains below the blocks above (see #profile-spritebook-block
             in globals.css). Scroll position resets to top every time the panel opens (see
             refreshProfilePanel). -->
        <div class="profile-block" id="profile-spritebook-block">
            <div id="profile-spritebook-scroll">
                <div id="profile-sprite-grid"></div>
            </div>
        </div>
    </div>
</div>
