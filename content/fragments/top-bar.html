<!-- The permanent rail (#dotto-rail) replaces the old single #btn-menu button — a full-height
     strip of icons, each opening its own view inside #hamburger-stack (see openRailView,
     panels-hamburger.js) via click-only open/switch/close (no hover preview). Back/forward live in
     #top-bar-center instead (see #nav-arrows-pill below) — they're page-navigation, not
     rail-icon-style view triggers, and read better beside the breadcrumb they actually move.
     Icons are grouped into seven .rail-group wrappers (see globals.css) — a fixed 10px gap between
     buttons WITHIN a group. Groups 1-6 stack at the top of the rail with a dividing line between
     each consecutive pair (.rail-group-divider, on groups 3-6 — the line ABOVE that group),
     except between groups 1 and 2, which get a bigger plain gap instead of a line
     (.rail-group-gap-lg, on group 2). Group 7 (.rail-group-bottom) is pushed down to the very
     bottom of the rail via margin-top:auto, same technique the old #rail-bottom-group used before
     it was folded into this group system. The rail no longer expands/shows text labels (that
     feature — #btn-sidebar-toggle, #dotto-rail.expanded, .rail-label — was removed per explicit
     request); every icon is a fixed 32px square with a hover tooltip only, same as before that
     feature existed. -->
<div id="dotto-rail">
    <!-- Group 1: profile, alone. -->
    <div class="rail-group">
        <!-- At the very top of the rail now, ahead of every panel-trigger icon — content is
             React-owned (see app/dotto/ProfileAvatarSm.jsx). Click-only open/close, same as every
             other rail icon (see wireRailIcon('profile', ...), profile-achievements-pricing.js). -->
        <button id="btn-profile" class="rail-btn">
            <div class="profile-avatar-sm" id="profile-avatar-sm"></div>
            <span class="rail-tooltip">Profile<span class="rail-tooltip-key">P</span></span>
        </button>
    </div>
    <!-- Group 2: cursor-mode selector, then Inbox. The cursor-mode selector used to sit alone in
         its own group at the very bottom of the rail (group 7) — moved up here, above Inbox, per
         explicit request; it no longer expands downward on hover (there's nothing below it in this
         group to push), instead expanding rightward, overflowing past the rail's own edge (see
         #mode-toolbar, globals.css). #inbox-panel (hamburger-stack.html) is a bare shell for now —
         behavior/content not yet decided, wired into the shared openRailView mechanism (see
         wireRailIcon('inbox', ...), panels-hamburger.js) so the icon has somewhere to open.
         inbox.png doesn't exist in the repo yet — flagged the same way sidebar.png/dotbot.png were
         earlier this session. rail-group-gap-lg: a bigger gap above this group instead of the
         dividing line every other group gets, per explicit request (was on the Search/Explain
         group before Inbox took this position). -->
    <div class="rail-group rail-group-gap-lg">
        <!-- Cursor-mode selector — collapsed shows only the currently active mode; hovering expands
             it (see #mode-toolbar.expanded, globals.css) rightward to reveal all four, same
             collapse/expand behavior it had as its own floating bottom-center toolbar, just living
             in the rail's own column now. -->
        <div id="mode-toolbar">
            <button class="rail-btn mode-btn mode-visible active" data-mode="normal">
                <img class="rail-icon-img" src="/assets/icons/default-cursor.png" alt="">
                <span class="rail-tooltip">Move &amp; select (default cursor) — tap Escape, hold for temporary</span>
            </button>
            <button class="rail-btn mode-btn" data-mode="data">
                <img class="rail-icon-img" src="/assets/icons/data-cursor.png" alt="">
                <span class="rail-tooltip">Data mode — drag from one card to another to link them — tap D, hold for temporary</span>
            </button>
            <button class="rail-btn mode-btn" data-mode="select">
                <img class="rail-icon-img" src="/assets/icons/select-cursor.png" alt="">
                <span class="rail-tooltip">Select mode — click or drag to select multiple cards — tap Shift, hold for temporary</span>
            </button>
            <!-- Pen mode — reworked from the old Add-menu "Drawing" toggle (setDrawMode) into a
                 real cursor mode, see applyCursorMode/handlePenPointerDown (source-buttons-cursor-
                 mode.js/srs-connections-core.js). No tap/hold keyboard shortcut yet (unlike the
                 other three) — no unclaimed single letter has an obvious mnemonic, so entering pen
                 mode is click-only for now. -->
            <button class="rail-btn mode-btn" data-mode="pen">
                <img class="rail-icon-img" src="/assets/icons/pen.png" alt="">
                <span class="rail-tooltip">Pen mode — click and drag to draw freehand, or click point by point for straight lines (Enter/Escape/double-click to finish a line)</span>
            </button>
        </div>
        <button id="btn-inbox" class="rail-btn"><img class="rail-icon-img" src="/assets/icons/inbox.png" alt=""><span class="rail-tooltip">Inbox<span class="rail-tooltip-key">I</span></span></button>
    </div>
    <!-- Group 3: Search, outline tree, Waypoints. #search-panel (hamburger-stack.html) is a bare
         shell for now — behavior/content not yet decided, wired into the shared openRailView
         mechanism (see wireRailIcon('search', ...), panels-hamburger.js) so the icon has somewhere
         to open. -->
    <div class="rail-group rail-group-divider">
        <button id="btn-search" class="rail-btn"><img class="rail-icon-img" src="/assets/icons/search.png" alt=""><span class="rail-tooltip">Search<span class="rail-tooltip-key">/</span></span></button>
        <button id="btn-menu" class="rail-btn"><img class="rail-icon-img" src="/assets/icons/menu-btn.png" alt=""><span class="rail-tooltip">Outline<span class="rail-tooltip-key">O</span></span></button>
        <button id="rail-btn-waypoints" class="rail-btn"><img class="rail-icon-img" src="/assets/icons/waypoint.png" alt=""><span class="rail-tooltip">Waypoints<span class="rail-tooltip-key">W</span></span></button>
    </div>
    <!-- Group 4: Basics, Library, Marketplace. -->
    <div class="rail-group rail-group-divider">
        <button id="btn-add" class="rail-btn"><img class="rail-icon-img" src="/assets/icons/add-btn.png" alt=""><span class="rail-tooltip">Basics<span class="rail-tooltip-key">B</span></span></button>
        <!-- Own drafts/published/purchased items — used to be a Library tab sharing #cart-panel with
             Discover; now a fully separate rail icon/panel (see wireRailIcon('library', ...),
             marketplace.js). -->
        <button id="btn-library" class="rail-btn"><img class="rail-icon-img" src="/assets/icons/library.png" alt=""><span class="rail-tooltip">Library<span class="rail-tooltip-key">L</span></span></button>
        <button id="btn-cart" class="rail-btn"><img class="rail-icon-img" src="/assets/icons/market-button.png" alt=""><span class="rail-tooltip">Marketplace<span class="rail-tooltip-key">;</span></span></button>
    </div>
    <!-- Group 5: Collaborations, Messages. -->
    <div class="rail-group rail-group-divider">
        <button id="rail-btn-collab" class="rail-btn"><img class="rail-icon-img" src="/assets/icons/collaboration.png" alt=""><span class="rail-tooltip">Collaborations<span class="rail-tooltip-key">C</span></span></button>
        <button id="btn-messages" class="rail-btn"><img class="rail-icon-img" src="/assets/icons/chats-btn.png" alt=""><span class="rail-tooltip">Messages<span class="rail-tooltip-key">M</span></span></button>
    </div>
    <!-- Group 6: Queries, Sources, Files. Documents (which used to sit here, first) was deleted
         per explicit request, and Queries — which used to have its own solo group directly under
         Inbox — moved into the now-empty first slot in its place, collapsing that old group away
         entirely. Queries: AI chat, "Ask Dotbot" -> "Explain" -> "Queries", each renamed per
         explicit request; dotbot.png doesn't exist in the repo yet (search.png moved to
         #btn-search above, which needed its own icon back) — flagged the same way sidebar.png was
         a few commits ago. Files (was Snippets, renamed per explicit request — #btn-snippets/
         #snippets-panel keep their internal id, same convention as Basics/Queries staying
         #btn-add/#rail-btn-ai under the hood) and Sources: #sources-panel/#snippets-panel
         (hamburger-stack.html) are bare shells for now — behavior/content not yet decided, wired
         into the shared openRailView mechanism (see wireRailIcon('sources'/'snippets', ...),
         panels-hamburger.js) so each icon has somewhere to open. -->
    <div class="rail-group rail-group-divider">
        <button id="rail-btn-ai" class="rail-btn"><img class="rail-icon-img" src="/assets/icons/dotbot.png" alt=""><span class="rail-tooltip">Queries<span class="rail-tooltip-key">Q</span></span></button>
        <button id="btn-sources" class="rail-btn"><img class="rail-icon-img" src="/assets/icons/sources.png" alt=""><span class="rail-tooltip">Sources<span class="rail-tooltip-key">S</span></span></button>
        <button id="btn-snippets" class="rail-btn"><img class="rail-icon-img" src="/assets/icons/snippets.png" alt=""><span class="rail-tooltip">Files<span class="rail-tooltip-key">F</span></span></button>
    </div>
    <!-- Group 7: light/dark theme toggle, alone — the very bottom of the rail
         (.rail-group-bottom's own margin-top:auto pushes it down, away from groups 1-6 which stack
         at the top). The cursor-mode selector used to share this group, above the toggle — moved
         up to group 2 per explicit request (see its own comment there). -->
    <div class="rail-group rail-group-bottom">
        <!-- Icon shows the theme clicking it would SWITCH TO (light.png here since dark is the
             app's default, per explicit request — see theme-toggle.js, which swaps it to dark.png
             once light mode is active), not the currently-active one. Tooltip text ("Light
             mode"/"Dark mode") is kept in sync with the icon by the same module. Wiring (click
             handler, localStorage persistence, icon+tooltip sync) all lives in theme-toggle.js —
             this button isn't routed through openRailView/wireRailIcon since it doesn't open a
             panel. -->
        <button id="btn-theme-toggle" class="rail-btn"><img class="rail-icon-img" src="/assets/icons/light.png" alt=""><span class="rail-tooltip">Light mode<span class="rail-tooltip-key">\</span></span></button>
    </div>
</div>
<!-- Dead centre of the viewport (position:fixed, left:50% + translateX(-50%), see globals.css) —
     independent of the rail's own left offset. Back/forward (history navigation, see
     jumpToHistoryIndex, resize-shortcuts-init.js) sit in their own pill to the left of the
     compact "…/parent/current" breadcrumb (see app/dotto/BreadcrumbPill.jsx, breadcrumbMapStore),
     with the per-canvas "add a collaborator" flyout to the breadcrumb's right — all three riding
     in the same centred group rather than each picking their own position. -->
<div id="top-bar-center">
    <div class="bubble" id="nav-arrows-pill">
        <button id="btn-back" class="btn" title="Back">←</button>
        <button id="btn-forward" class="btn" title="Forward">→</button>
    </div>
    <div class="bubble" id="breadcrumb-pill"></div>
    <div class="bubble" id="collab-bubble">
        <div id="collab-content"></div>
        <div class="collab-tooltip" id="collab-tooltip"></div>
    </div>
</div>
<!-- Sits in the exact same fixed top:20px/centred slot as #top-bar-center, off-screen (slid up,
     faded out) at rest — the two swap places via one shared .notif-active class, both toggled
     together by showNotification/dismissCurrentNotification (public/dotto/stopwatch-search-
     notifications.js). Static here rather than fully React-rendered, unlike its own content
     (#notification-root, portaled into by app/dotto/NotificationBar.jsx) — the vanilla engine
     needs a stable, always-present node to toggle classes on directly. -->
<div id="notification-pill">
    <div id="notification-root"></div>
</div>
