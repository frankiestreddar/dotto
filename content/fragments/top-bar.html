<!-- The permanent rail (#dotto-rail) replaces the old single #btn-menu button — a full-height
     strip of icons, each opening its own view inside #hamburger-stack (see openRailView,
     panels-hamburger.js) via click-only open/switch/close (no hover preview). Back/forward live in
     #top-bar-center instead (see #nav-arrows-pill below) — they're page-navigation, not
     rail-icon-style view triggers, and read better beside the breadcrumb they actually move.
     Icons are grouped into six .rail-group wrappers (see globals.css) — a fixed 10px gap between
     buttons WITHIN a group. Groups 1-5 stack at the top of the rail with a dividing line between
     each consecutive pair (.rail-group-divider, on groups 3/4/5 — the line ABOVE that group),
     except between groups 1 and 2, which get a bigger plain gap instead of a line
     (.rail-group-gap-lg, on group 2). Group 6 (.rail-group-bottom) is pushed down to the very
     bottom of the rail via margin-top:auto, same technique the old #rail-bottom-group used before
     it was folded into this six-group system. -->
<div id="dotto-rail">
    <!-- Group 1: profile, alone. -->
    <div class="rail-group">
        <!-- At the very top of the rail now, ahead of every panel-trigger icon — content is
             React-owned (see app/dotto/ProfileAvatarSm.jsx). Click-only open/close, same as every
             other rail icon (see wireRailIcon('profile', ...), profile-achievements-pricing.js). -->
        <button id="btn-profile" class="rail-btn">
            <div class="profile-avatar-sm" id="profile-avatar-sm"></div>
            <span class="rail-tooltip">Profile<span class="rail-tooltip-key">P</span></span>
        </button>
    </div>
    <!-- Group 2: Search, Ask Dotbot (AI chat). #search-panel (hamburger-stack.html) is a bare shell
         for now — behavior/content not yet decided, wired into the shared openRailView mechanism
         (see wireRailIcon('search', ...), panels-hamburger.js) so the icon has somewhere to open.
         rail-group-gap-lg: a bigger gap above this group instead of the dividing line every other
         group gets, per explicit request. -->
    <div class="rail-group rail-group-gap-lg">
        <button id="btn-search" class="rail-btn"><img class="rail-icon-img" src="/assets/icons/search.png" alt=""><span class="rail-label">Search</span><span class="rail-tooltip">Search</span></button>
        <!-- dotbot.png doesn't exist in the repo yet (search.png moved to #btn-search above, which
             needed its own icon back) — flagged the same way sidebar.png was two commits ago. -->
        <button id="rail-btn-ai" class="rail-btn"><img class="rail-icon-img" src="/assets/icons/dotbot.png" alt=""><span class="rail-label">Ask Dotbot</span><span class="rail-tooltip">Ask Dotbot<span class="rail-tooltip-key">/</span></span></button>
    </div>
    <!-- Group 3: outline tree, Waypoints. -->
    <div class="rail-group rail-group-divider">
        <button id="btn-menu" class="rail-btn"><img class="rail-icon-img" src="/assets/icons/menu-btn.png" alt=""><span class="rail-label">Outline</span><span class="rail-tooltip">Outline<span class="rail-tooltip-key">M</span></span></button>
        <button id="rail-btn-waypoints" class="rail-btn"><img class="rail-icon-img" src="/assets/icons/waypoint.png" alt=""><span class="rail-label">Waypoints</span><span class="rail-tooltip">Waypoints<span class="rail-tooltip-key">W</span></span></button>
    </div>
    <!-- Group 4: Add, Library, Marketplace. -->
    <div class="rail-group rail-group-divider">
        <button id="btn-add" class="rail-btn"><img class="rail-icon-img" src="/assets/icons/add-btn.png" alt=""><span class="rail-label">Add</span><span class="rail-tooltip">Add<span class="rail-tooltip-key">A</span></span></button>
        <!-- Own drafts/published/purchased items — used to be a Library tab sharing #cart-panel with
             Discover; now a fully separate rail icon/panel (see wireRailIcon('library', ...),
             marketplace.js). -->
        <button id="btn-library" class="rail-btn"><img class="rail-icon-img" src="/assets/icons/library.png" alt=""><span class="rail-label">Library</span><span class="rail-tooltip">Library<span class="rail-tooltip-key">L</span></span></button>
        <button id="btn-cart" class="rail-btn"><img class="rail-icon-img" src="/assets/icons/market-button.png" alt=""><span class="rail-label">Marketplace</span><span class="rail-tooltip">Marketplace<span class="rail-tooltip-key">S</span></span></button>
    </div>
    <!-- Group 5: Collaborations, Messages. -->
    <div class="rail-group rail-group-divider">
        <button id="rail-btn-collab" class="rail-btn"><img class="rail-icon-img" src="/assets/icons/collaboration.png" alt=""><span class="rail-label">Collaborations</span><span class="rail-tooltip">Collaborations<span class="rail-tooltip-key">G</span></span></button>
        <button id="btn-messages" class="rail-btn"><img class="rail-icon-img" src="/assets/icons/chats-btn.png" alt=""><span class="rail-label">Messages</span><span class="rail-tooltip">Messages<span class="rail-tooltip-key">T</span></span></button>
    </div>
    <!-- Group 6: cursor-mode selector, sidebar expand/collapse toggle — the very bottom of the
         rail (.rail-group-bottom's own margin-top:auto pushes it down, away from groups 1-5 which
         stack at the top). -->
    <div class="rail-group rail-group-bottom">
        <!-- Cursor-mode selector — collapsed shows only the currently active mode; hovering expands
             it (see #mode-toolbar.expanded, globals.css) to reveal all three stacked, same
             collapse/expand behavior it had as its own floating bottom-center toolbar, just living
             in the rail's own column now. -->
        <div id="mode-toolbar">
            <button class="rail-btn mode-btn mode-visible active" data-mode="normal">
                <img class="rail-icon-img" src="/assets/icons/default-cursor.png" alt="">
                <span class="rail-tooltip">Move &amp; select (default cursor) — tap Escape, hold for temporary</span>
            </button>
            <button class="rail-btn mode-btn" data-mode="data">
                <img class="rail-icon-img" src="/assets/icons/data-cursor.png" alt="">
                <span class="rail-tooltip">Data mode — drag from one card to another to link them — tap D, hold for temporary</span>
            </button>
            <button class="rail-btn mode-btn" data-mode="select">
                <img class="rail-icon-img" src="/assets/icons/select-cursor.png" alt="">
                <span class="rail-tooltip">Select mode — click or drag to select multiple cards — tap Shift, hold for temporary</span>
            </button>
        </div>
        <!-- Manually toggles #dotto-rail.expanded (see wireSidebarToggle, panels-hamburger.js),
             independent of whether any panel is open. -->
        <button id="btn-sidebar-toggle" class="rail-btn"><img class="rail-icon-img" src="/assets/icons/sidebar.png" alt=""><span class="rail-label">Sidebar</span><span class="rail-tooltip">Toggle sidebar</span></button>
    </div>
</div>
<!-- Dead centre of the viewport (position:fixed, left:50% + translateX(-50%), see globals.css) —
     independent of the rail's own left offset. Back/forward (history navigation, see
     jumpToHistoryIndex, resize-shortcuts-init.js) sit in their own pill to the left of the
     compact "…/parent/current" breadcrumb (see app/dotto/BreadcrumbPill.jsx, breadcrumbMapStore),
     with the per-canvas "add a collaborator" flyout to the breadcrumb's right — all three riding
     in the same centred group rather than each picking their own position. -->
<div id="top-bar-center">
    <div class="bubble" id="nav-arrows-pill">
        <button id="btn-back" class="btn" title="Back">←</button>
        <button id="btn-forward" class="btn" title="Forward">→</button>
    </div>
    <div class="bubble" id="breadcrumb-pill"></div>
    <div class="bubble" id="collab-bubble">
        <div id="collab-content"></div>
        <div class="collab-tooltip" id="collab-tooltip"></div>
    </div>
</div>
<!-- Sits in the exact same fixed top:20px/centred slot as #top-bar-center, off-screen (slid up,
     faded out) at rest — the two swap places via one shared .notif-active class, both toggled
     together by showNotification/dismissCurrentNotification (public/dotto/stopwatch-search-
     notifications.js). Static here rather than fully React-rendered, unlike its own content
     (#notification-root, portaled into by app/dotto/NotificationBar.jsx) — the vanilla engine
     needs a stable, always-present node to toggle classes on directly. -->
<div id="notification-pill">
    <div id="notification-root"></div>
</div>
