<!-- The permanent rail (#dotto-rail) replaces the old single #btn-menu button — a full-height
     strip of icons, each opening its own view inside #hamburger-stack (see openRailView,
     panels-hamburger.js) via click-only open/switch/close (no hover preview). Back/forward live in
     each pane's own top-bar pill instead (see app/dotto/PaneTopBar.jsx, below) — they're
     page-navigation, not rail-icon-style view triggers, and read better beside the breadcrumb they
     actually move.
     Icons are grouped into .rail-group wrappers (see globals.css) — a fixed 10px gap between
     buttons WITHIN a group. Profile and the cursor-mode selector are pinned to the very bottom of
     the rail (cursor-mode selector directly above Profile), per explicit request — the inverse of
     an earlier layout where the two sat pinned at the top instead. Every other icon (Groups 2-6)
     now sits inside #dotto-rail-middle, a separate flex column ABOVE the two bottom-pinned groups
     that grows to fill whatever vertical space is left and packs its own children at the TOP of it
     (justify-content:flex-start, was center — per this same explicit request) rather than
     centering them in the middle of the rail.
     Groups 3-6 (now 2nd-5th inside that middle block) still get a dividing line between each
     consecutive pair (.rail-group-divider, the line ABOVE that group). The rail no longer expands/
     shows text labels (that feature — #btn-sidebar-toggle, #dotto-rail.expanded, .rail-label — was
     removed per explicit request); every icon is a fixed 32px square with a hover tooltip only,
     same as before that feature existed. Most icons' .rail-tooltip holds a .rail-tooltip-row
     (name + shortcut key, always visible on hover) plus an initially-empty .rail-tooltip-desc
     (a data-desc attribute carries its full text) — app/dotto/lib/railTooltipExpand.ts is what turns that into
     the full hold-to-expand animation per explicit request (widen + separate the name/key, then
     type the description out character by character while the panel grows to fit it), once a
     button's been continuously hovered for 2s; see that file's own comment for the whole sequence.
     Skipped on the four cursor-mode buttons, whose existing tooltips are already a single longer
     descriptive sentence rather than a short name a description panel would add much to. -->

<div id="dotto-rail">
    <!-- Groups 2-6 (Search+Queries, Blocks/Plugins/Marketplace, Outline/Waypoints/Routes,
         Messages/Collaborations/Servers, Files/Sources/Snippets) pack at the TOP of the rail
         now, per explicit request (justify-content:flex-start, #dotto-rail-middle, globals.css) —
         the inverse of an earlier layout where Profile and the cursor-mode selector sat pinned up
         here instead and these centered in the space below them. Those two are now the LAST two
         children of #dotto-rail, after this block closes — pinned to the bottom instead (see their
         own comments further down). -->
    <div id="dotto-rail-middle">
    <!-- Group 2: Search, then Queries (was Routes, then Queries — swapped with Group 3's own
         Search per explicit request; #search-panel, hamburger-stack.html, is a bare shell for now
         — behavior/content not yet decided, wired into the shared openRailView mechanism, see
         wireRailIcon('search', ...), panels-hamburger.js). Queries: moved here below it per an
         earlier explicit request — was in group 6 (now Files/Sources/Snippets, see its own
         comment) — #rail-btn-ai/#ai-panel keep their internal id unchanged, same convention as
         every other rename/relocation this session. -->
    <div class="rail-group">
        <button id="btn-search" class="rail-btn"><img class="rail-icon-img" src="/assets/icons/search.png" alt=""><span class="rail-tooltip"><span class="rail-tooltip-row"><span class="rail-tooltip-name">Search</span><span class="rail-tooltip-key">Tab</span></span><span class="rail-tooltip-desc" data-desc="Search across everything on this canvas."></span></span></button>
        <button id="rail-btn-ai" class="rail-btn"><img class="rail-icon-img" src="/assets/icons/queries.png" alt=""><span class="rail-tooltip"><span class="rail-tooltip-row"><span class="rail-tooltip-name">Queries</span><span class="rail-tooltip-key">Q</span></span><span class="rail-tooltip-desc" data-desc="Ask Dotbot questions about this canvas."></span></span></button>
    </div>
    <!-- Group 3 (was Group 5 — moved here, directly below Search/Queries, per explicit request):
         Blocks (was Essentials, was Basics before that — renamed per explicit request; #btn-add
         keeps its internal id), Plugins (was Library, then Extensions, now back to Plugins per
         explicit follow-up — #btn-library keeps its internal id throughout, shows installed
         marketplace extensions rather than your own drafts/published/purchased items, see
         BlocksPanel.jsx for where those moved), Marketplace. Plugins' own shortcut is P (freed up
         once Profile's own shortcut moved to Y in the same request — see #btn-profile below). -->
    <div class="rail-group rail-group-divider">
        <button id="btn-add" class="rail-btn"><img class="rail-icon-img" src="/assets/icons/blocks.png" alt=""><span class="rail-tooltip"><span class="rail-tooltip-row"><span class="rail-tooltip-name">Blocks</span><span class="rail-tooltip-key">B</span></span><span class="rail-tooltip-desc" data-desc="Add a note, heading, table, template, or other block to the canvas."></span></span></button>
        <button id="btn-library" class="rail-btn"><img class="rail-icon-img" src="/assets/icons/library.png" alt=""><span class="rail-tooltip"><span class="rail-tooltip-row"><span class="rail-tooltip-name">Plugins</span><span class="rail-tooltip-key">P</span></span><span class="rail-tooltip-desc" data-desc="Plugins installed from the marketplace."></span></span></button>
        <button id="btn-cart" class="rail-btn"><img class="rail-icon-img" src="/assets/icons/marketplace.png" alt=""><span class="rail-tooltip"><span class="rail-tooltip-row"><span class="rail-tooltip-name">Marketplace</span><span class="rail-tooltip-key">H</span></span><span class="rail-tooltip-desc" data-desc="Discover and buy templates and canvases from other creators."></span></span></button>
    </div>
    <!-- Group 4 (was Group 5 — swapped with the Messages/Collaborations/Servers group below per
         explicit request): Outline tree, Waypoints, Routes (Routes/Outline swapped per a later
         explicit request — was Routes, Waypoints, Outline). Routes (was Inbox, renamed per an
         earlier explicit request; id/wiring kept as 'inbox'/#btn-inbox/#inbox-panel under the hood,
         same convention as every other rename this session, e.g. Files staying #btn-snippets) is a
         bare shell for now — behavior/content not yet decided, wired into the shared openRailView
         mechanism (see wireRailIcon('inbox', ...), panels-hamburger.js) so the icon has somewhere
         to open. -->
    <div class="rail-group rail-group-divider">
        <button id="btn-menu" class="rail-btn"><img class="rail-icon-img" src="/assets/icons/outline.png" alt=""><span class="rail-tooltip"><span class="rail-tooltip-row"><span class="rail-tooltip-name">Outline</span><span class="rail-tooltip-key">O</span></span><span class="rail-tooltip-desc" data-desc="A collapsible tree of every block on this canvas."></span></span></button>
        <button id="rail-btn-waypoints" class="rail-btn"><img class="rail-icon-img" src="/assets/icons/waypoint.png" alt=""><span class="rail-tooltip"><span class="rail-tooltip-row"><span class="rail-tooltip-name">Waypoints</span><span class="rail-tooltip-key">W</span></span><span class="rail-tooltip-desc" data-desc="Saved locations on this canvas, sorted by distance from where you are now."></span></span></button>
        <button id="btn-inbox" class="rail-btn"><img class="rail-icon-img" src="/assets/icons/routes.png" alt=""><span class="rail-tooltip"><span class="rail-tooltip-row"><span class="rail-tooltip-name">Routes</span><span class="rail-tooltip-key">R</span></span><span class="rail-tooltip-desc" data-desc="Routes and destinations you've saved."></span></span></button>
    </div>
    <!-- Group 5 (was Group 4 — swapped with the Routes/Waypoints/Outline group above per explicit
         request): Messages, Collaborations (was Collaborations, then Messages — swapped per an
         earlier explicit request), Servers. Friends (#btn-friends/#friends-panel) — a
         never-implemented bare-shell stub, same as most of the icons here — removed entirely per
         explicit request; the real friend-list/friend-request data model (friends-presence.js)
         that Collaborations/Messages themselves depend on is untouched, only this dead rail icon/
         panel went. Servers (#btn-servers/#servers-panel, hamburger-stack.html) added below
         Messages/Collaborations per explicit request — a bare shell for now, same as most of this
         rail (behavior/content not yet decided), wired into the shared openRailView mechanism (see
         wireRailIcon('servers', ...), panels-hamburger.js) so the icon has somewhere to open. -->
    <div class="rail-group rail-group-divider">
        <button id="btn-messages" class="rail-btn"><img class="rail-icon-img" src="/assets/icons/messages.png" alt=""><span class="rail-tooltip"><span class="rail-tooltip-row"><span class="rail-tooltip-name">Messages</span><span class="rail-tooltip-key">M</span></span><span class="rail-tooltip-desc" data-desc="Direct messages and conversations."></span></span></button>
        <button id="rail-btn-collab" class="rail-btn"><img class="rail-icon-img" src="/assets/icons/collaboration.png" alt=""><span class="rail-tooltip"><span class="rail-tooltip-row"><span class="rail-tooltip-name">Collaborations</span><span class="rail-tooltip-key">C</span></span><span class="rail-tooltip-desc" data-desc="People collaborating with you on this canvas."></span></span></button>
        <button id="btn-servers" class="rail-btn"><img class="rail-icon-img" src="/assets/icons/servers.png" alt=""><span class="rail-tooltip"><span class="rail-tooltip-row"><span class="rail-tooltip-name">Servers</span><span class="rail-tooltip-key">S</span></span><span class="rail-tooltip-desc" data-desc="Servers you belong to."></span></span></button>
    </div>
    <!-- Group 6: Files, Sources, Snippets. Documents briefly existed here again
         (re-added after an earlier deletion, per a request specifying group order) but was removed
         again right after per an explicit follow-up correction, along with clarifying the intended
         order is Files first, then Sources, then Snippets — not Documents at all. Files (was ITSELF
         called Snippets, renamed to Files per an earlier explicit request — #btn-snippets/
         #snippets-panel keep their internal id, same convention as Essentials/Queries staying
         #btn-add/#rail-btn-ai under the hood) is a different button from the newer Snippets one
         (#btn-snippets2/#snippets2-panel) — the two briefly shared the same snippets.png icon (per
         explicit request at the time) until Files got its own files.png per a later explicit
         request to tell them apart. Sources/Snippets(new): #sources-panel/#snippets2-panel
         (hamburger-stack.html) are bare shells for now — behavior/content not yet decided, wired
         into the shared openRailView mechanism (see wireRailIcon('sources'/'snippets2', ...),
         panels-hamburger.js) so each icon has somewhere to open. -->
    <div class="rail-group rail-group-divider">
        <button id="btn-snippets" class="rail-btn"><img class="rail-icon-img" src="/assets/icons/files.png" alt=""><span class="rail-tooltip"><span class="rail-tooltip-row"><span class="rail-tooltip-name">Files</span><span class="rail-tooltip-key">F</span></span><span class="rail-tooltip-desc" data-desc="Files and snippets you've saved."></span></span></button>
        <button id="btn-sources" class="rail-btn"><img class="rail-icon-img" src="/assets/icons/sources.png" alt=""><span class="rail-tooltip"><span class="rail-tooltip-row"><span class="rail-tooltip-name">Sources</span><span class="rail-tooltip-key">K</span></span><span class="rail-tooltip-desc" data-desc="Structured source tables you can reference and query."></span></span></button>
        <button id="btn-snippets2" class="rail-btn"><img class="rail-icon-img" src="/assets/icons/snippets.png" alt=""><span class="rail-tooltip"><span class="rail-tooltip-row"><span class="rail-tooltip-name">Snippets</span><span class="rail-tooltip-key">S</span></span><span class="rail-tooltip-desc" data-desc="Reusable snippets you can drop onto any canvas."></span></span></button>
    </div>
    </div>
    <!-- Cursor-mode selector, alone — pinned to the bottom of the rail, directly above Profile
         (below it in this markup), per explicit request that both move here from their earlier
         position pinned at the top (had also briefly been its own pinned group below Settings
         before that, and before THAT sat at the top of Group 2, above Routes — see git history for
         all three). Its popup opens upward again (.mode-popup's bottom:-6px, was top:0 — see that
         rule's own comment, globals.css) now that it's at the very bottom of the rail with no room
         below it, rather than near the top with room below. No button-specific tightened-hitbox
         treatment — the safe-zone polygon (modePopupSafeZone, app/dotto/lib/sourceButtonsCursorMode.ts)
         covers the general case (including this one, even with Profile now a guaranteed-adjacent
         neighbor below it again) on its own, same as every position this selector has sat in
         before. -->
    <div class="rail-group">
        <!-- Cursor-mode selector — per explicit follow-up request, the collapsed rail button
             (icon-only, .mode-visible shows whichever mode is active) now stays exactly where it
             is at all times, never itself restyled/moved on hover — a SEPARATE #mode-popup panel
             (one cohesive box, not 4 individually-bordered pills) appears next to it instead,
             listing all four modes as icon+name rows (.mode-popup-row — a different, new element
             from the original 4 .mode-btn, deliberately NOT reusing that class, so
             appState.modeButtons/the existing display:none-when-collapsed rules stay scoped to
             just the rail button and don't need to care about this popup's own always-a-row
             styling). Rows stay in this fixed DOM order always — an earlier version sorted the
             active mode to the top, removed per explicit follow-up request — the active mode just
             gets a highlighted/outlined .active state instead (see appState.modePopupRows,
             core-state.js, and its own click wiring in app/dotto/lib/sourceButtonsCursorMode.ts, mirroring
             appState.modeButtons' click handler). Moving the pointer from the button toward a row
             further from it without closing the popup early is handled by a JS "safe zone" polygon
             (modePopupSafeZone/handleModePopupSafeMove, app/dotto/lib/sourceButtonsCursorMode.ts) rather than
             any DOM element here. -->
        <div id="mode-toolbar">
            <button class="rail-btn mode-btn mode-visible active" data-mode="normal">
                <img class="rail-icon-img" src="/assets/icons/default-cursor.png" alt="">
            </button>
            <button class="rail-btn mode-btn" data-mode="data">
                <img class="rail-icon-img" src="/assets/icons/data-cursor.png" alt="">
            </button>
            <button class="rail-btn mode-btn" data-mode="select">
                <img class="rail-icon-img" src="/assets/icons/select-cursor.png" alt="">
            </button>
            <!-- Drawing — was "Pen mode" before an explicit rename request; still internally the
                 'pen' cardMode/data-mode value throughout (applyCursorMode/handlePenPointerDown,
                 app/dotto/lib/sourceButtonsCursorMode.ts/srs-connections-core.js), same "id stays, display
                 name changes" convention as every other rename in this file. Tap/hold 'D' now
                 enters it (beginModeOverride/endModeOverride('d', 'pen')) — that same request moved
                 it here from 'P' (freed up in turn for Profile's own rail shortcut, which moved off
                 Tab), and took 'D' away from Data mode, which has no shortcut of its own anymore. -->
            <button class="rail-btn mode-btn" data-mode="pen">
                <img class="rail-icon-img" src="/assets/icons/pen.png" alt="">
            </button>
            <!-- Each row's .mode-popup-row-key badge mirrors the tap/hold keyboard shortcut that
                 also switches to that mode (see the keydown/keyup listeners, source-buttons-cursor-
                 mode.js) — Escape for Move & select since that's its own dedicated key, not a
                 letter. Data mode's row has no badge at all (see Drawing's own comment just above)
                 — its own toolbar button/row click still switch to it, just not a keyboard shortcut
                 anymore. Per explicit request the CURRENTLY ACTIVE mode's row hides its own badge
                 (redundant to show the shortcut for the mode you're already in) — handled purely in
                 CSS off the same .active class this JS already toggles per-row above, no separate
                 JS needed (.mode-popup-row.active .mode-popup-row-key{display:none}, globals.css). -->
            <div id="mode-popup" class="mode-popup">
                <button class="mode-popup-row" data-mode="normal">
                    <img class="rail-icon-img" src="/assets/icons/default-cursor.png" alt="">
                    <span class="mode-popup-row-name">Move &amp; select</span>
                    <span class="mode-popup-row-key">Esc</span>
                </button>
                <button class="mode-popup-row" data-mode="data">
                    <img class="rail-icon-img" src="/assets/icons/data-cursor.png" alt="">
                    <span class="mode-popup-row-name">Data mode</span>
                </button>
                <button class="mode-popup-row" data-mode="select">
                    <img class="rail-icon-img" src="/assets/icons/select-cursor.png" alt="">
                    <span class="mode-popup-row-name">Select mode</span>
                    <span class="mode-popup-row-key">Shift</span>
                </button>
                <button class="mode-popup-row" data-mode="pen">
                    <img class="rail-icon-img" src="/assets/icons/pen.png" alt="">
                    <span class="mode-popup-row-name">Drawing</span>
                    <span class="mode-popup-row-key">D</span>
                </button>
            </div>
        </div>
    </div>
    <!-- You (was Profile, renamed per explicit request — #btn-profile keeps its internal id, same
         "id stays, display name changes" convention as every other rename in this file), alone —
         pinned to the very bottom of the rail (last child of #dotto-rail), per explicit request
         that it and the cursor-mode selector above it move here from the top, swapping places with
         every other icon (now packed at the top instead, see #dotto-rail-middle's own comment
         above). Shortcut moved to Y in the same rename request, freeing P back up for Plugins
         (above). -->
    <div class="rail-group">
        <!-- Content is React-owned (see app/dotto/ProfileAvatarSm.jsx). Click-only open/close, same
             as every other rail icon (see wireRailIcon('profile', ...),
             profile-achievements-pricing.js). -->
        <button id="btn-profile" class="rail-btn">
            <div class="profile-avatar-sm" id="profile-avatar-sm"></div>
            <span class="rail-tooltip"><span class="rail-tooltip-row"><span class="rail-tooltip-name">You</span><span class="rail-tooltip-key">Y</span></span><span class="rail-tooltip-desc" data-desc="Your account, achievements, and pricing."></span></span>
        </button>
    </div>
</div>
<!-- Dead centre of the viewport (position:fixed, left:50% + translateX(-50%), see globals.css) —
     independent of the rail's own left offset. Used to hold back/forward, the tabs bar, and the
     per-canvas "add a collaborator" flyout trigger as three sections of one merged pill, shared by
     whichever pane happened to be active. Split-screen Stage 8, explicit correction: every pane now
     renders its OWN full copy of all three (nav-arrows/tab row/collab bubble/add-tab button
     together — see app/dotto/PaneTopBar.jsx, mounted per pane from PaneCanvasArea.jsx), each
     independently hover-expanding, so there's nothing left for a single shared element to show.
     #top-bar-center itself survives as an empty, fully inert div only because removing it outright
     would mean re-touching every pane-qualified selector that assumes #dotto-rail/#top-bar-center
     share the same base z-index tier (see #dotto-rail's own comment) for no real behavioural gain
     — see globals.css. Notifications no longer swap places with it (moved to their own independent
     top-right stack, fully React-rendered — see app/dotto/NotificationBar.jsx, .notification-stack
     in globals.css); there's no static notification markup left in this file at all. -->
<div id="top-bar-center"></div>
<!-- File-upload popup — U toggles it open/closed. Not a #hamburger-stack railViewEls/railIconBtns
     entry (no rail icon triggers it, only the U shortcut) — a small rounded-corner floating box
     near the rail's bottom-left, per explicit follow-up request that it NOT be a sidebar panel (a
     slide-in-from-behind-the-rail design an earlier request had asked for, since reverted — see
     #upload-popup's own comment, globals.css, for that shape's own history). No longer cross-closes
     with the hamburger-stack rail view either, now that the two don't occupy the same screen
     position any more.
     .search-panel-heading/-desc (globals.css) reused verbatim for the "Upload"
     title/subtext, same as Search/Queries already share them with each other.
     #upload-dropzone is the click-or-drag hotspot — picking/dropping a file just stores it
     locally (see upload-popup.js) and shows its name here; nothing touches the canvas until
     #upload-popup-btn is actually clicked, which is what creates the blank 'media' item and hands
     the already-picked file to processMediaFile (app/dotto/lib/mediaPdfEpub.ts) — the same FileReader/
     Supabase-storage pipeline the Media card's own "Upload" button uses (via triggerMediaUpload,
     a thin wrapper around that same function for the picker-then-process flow), not a
     reimplementation. -->
<div id="upload-popup">
    <button id="upload-popup-close" class="upload-popup-close" title="Close">✕</button>
    <h2 class="search-panel-heading">Upload</h2>
    <p class="search-panel-desc">Add a file to your canvas.</p>
    <div id="upload-dropzone" class="upload-dropzone">
        <span id="upload-dropzone-label" class="upload-dropzone-label">Drag a file here, or click to browse</span>
    </div>
    <button id="upload-popup-btn" class="upload-popup-btn" disabled>Add to canvas</button>
</div>
