<!-- The permanent rail (#dotto-rail) replaces the old single #btn-menu button — a full-height
     strip of icons, each opening its own view inside #hamburger-stack (see openRailView,
     panels-hamburger.js) via click-only open/switch/close (no hover preview). Back/forward live in
     #top-bar-center instead (see #nav-arrows-pill below) — they're page-navigation, not
     rail-icon-style view triggers, and read better beside the breadcrumb they actually move.
     Icons are grouped into seven .rail-group wrappers (see globals.css) — a fixed 10px gap between
     buttons WITHIN a group. Group 1 (profile) is pinned to the very top, and Group 7 (Settings,
     alone — the light/dark toggle used to live here too, moved into Settings' own panel, see its
     own comment further down) is pinned to the very bottom — neither one moves.
     Groups 2-6 sit inside #dotto-rail-middle, a separate flex column between the two that grows to
     fill whatever vertical space is left and centers its own children within it (justify-content:
     center) — per explicit request, replacing the old "everything just stacks at the top" layout.
     Groups 3-6 (now 2nd-5th inside that middle block) still get a dividing line between each
     consecutive pair (.rail-group-divider, the line ABOVE that group). The rail no longer expands/
     shows text labels (that feature — #btn-sidebar-toggle, #dotto-rail.expanded, .rail-label — was
     removed per explicit request); every icon is a fixed 32px square with a hover tooltip only,
     same as before that feature existed. Most icons' .rail-tooltip holds a .rail-tooltip-row
     (name + shortcut key, always visible on hover) plus an initially-empty .rail-tooltip-desc
     (a data-desc attribute carries its full text) — rail-tooltip-expand.js is what turns that into
     the full hold-to-expand animation per explicit request (widen + separate the name/key, then
     type the description out character by character while the panel grows to fit it), once a
     button's been continuously hovered for 2s; see that file's own comment for the whole sequence.
     Skipped on the four cursor-mode buttons, whose existing tooltips are already a single longer
     descriptive sentence rather than a short name a description panel would add much to. -->

<div id="dotto-rail">
    <!-- Group 1: profile, alone — pinned to the very top of the rail, outside
         #dotto-rail-middle's centered block below. -->
    <div class="rail-group">
        <!-- At the very top of the rail now, ahead of every panel-trigger icon — content is
             React-owned (see app/dotto/ProfileAvatarSm.jsx). Click-only open/close, same as every
             other rail icon (see wireRailIcon('profile', ...), profile-achievements-pricing.js). -->
        <button id="btn-profile" class="rail-btn">
            <div class="profile-avatar-sm" id="profile-avatar-sm"></div>
            <span class="rail-tooltip"><span class="rail-tooltip-row"><span class="rail-tooltip-name">Profile</span><span class="rail-tooltip-key">P</span></span><span class="rail-tooltip-desc" data-desc="Your account, achievements, and pricing."></span></span>
        </button>
    </div>
    <!-- Groups 2-6 (cursor-mode+Inbox+Queries, Search/Outline/Waypoints, Essentials/Library/
         Marketplace, Friends/Collaborations/Messages, Files/Sources/Snippets) center as one block
         in whatever space is left between the pinned Group 1 above and the pinned Group 7 below
         (see #dotto-rail-middle, globals.css) — per explicit request. -->
    <div id="dotto-rail-middle">
    <!-- Group 2: cursor-mode selector, then Inbox, then Queries below it. The cursor-mode selector
         used to sit alone in its own group at the very bottom of the rail (group 7) — moved up here,
         above Inbox, per explicit request; it no longer expands downward on hover (there's nothing
         below it in this group to push), instead expanding rightward, overflowing past the rail's
         own edge (see #mode-toolbar, globals.css). #inbox-panel (hamburger-stack.html) is a bare
         shell for now — behavior/content not yet decided, wired into the shared openRailView
         mechanism (see wireRailIcon('inbox', ...), panels-hamburger.js) so the icon has somewhere to
         open. inbox.png doesn't exist in the repo yet — flagged the same way sidebar.png/dotbot.png
         were earlier this session. No longer needs its own bigger top gap (rail-group-gap-lg,
         dropped) now that it sits inside the centered #dotto-rail-middle block rather than directly
         under Group 1 — #dotto-rail-middle's own gap already spaces it from its siblings uniformly.
         Queries: moved here below Inbox per explicit request — was in group 6 (now Files/Sources/
         Snippets, see its own comment) — #rail-btn-ai/#ai-panel keep their internal id unchanged,
         same convention as every other rename/relocation this session. -->
    <div class="rail-group">
        <!-- Cursor-mode selector — collapsed shows only the currently active mode (icon only, same
             32x32 .rail-btn square as any other rail icon). Hovering shows a popup list instead of
             the row of bare icons this used to expand into, per explicit request — each of the 4
             .mode-btn becomes a full icon+name row (see #mode-toolbar.expanded, globals.css),
             stacked vertically to the right of the rail (same left:calc(100% + 12px) anchor every
             other rail popup uses), rather than reparenting into a separate wrapper element — they
             stay the exact same clickable buttons either way, just restyled, so the existing click
             wiring (appState.modeButtons, srs-connections-core.js) needed no changes at all. The
             old one-line "tap X, hold for temporary" explanations are dropped from this view (icon
             + name only, matching what was actually asked for) rather than trying to cram a
             multi-character key badge into the fixed single-glyph .rail-tooltip-key box. -->
        <div id="mode-toolbar">
            <button class="rail-btn mode-btn mode-visible active" data-mode="normal">
                <img class="rail-icon-img" src="/assets/icons/default-cursor.png" alt="">
                <span class="mode-btn-name">Move &amp; select</span>
            </button>
            <button class="rail-btn mode-btn" data-mode="data">
                <img class="rail-icon-img" src="/assets/icons/data-cursor.png" alt="">
                <span class="mode-btn-name">Data mode</span>
            </button>
            <button class="rail-btn mode-btn" data-mode="select">
                <img class="rail-icon-img" src="/assets/icons/select-cursor.png" alt="">
                <span class="mode-btn-name">Select mode</span>
            </button>
            <!-- Pen mode — reworked from the old Add-menu "Drawing" toggle (setDrawMode) into a
                 real cursor mode, see applyCursorMode/handlePenPointerDown (source-buttons-cursor-
                 mode.js/srs-connections-core.js). No tap/hold keyboard shortcut (unlike the other
                 three) — no unclaimed single letter has an obvious mnemonic, so entering pen mode
                 is click-only. -->
            <button class="rail-btn mode-btn" data-mode="pen">
                <img class="rail-icon-img" src="/assets/icons/pen.png" alt="">
                <span class="mode-btn-name">Pen mode</span>
            </button>
        </div>
        <button id="btn-inbox" class="rail-btn"><img class="rail-icon-img" src="/assets/icons/inbox.png" alt=""><span class="rail-tooltip"><span class="rail-tooltip-row"><span class="rail-tooltip-name">Inbox</span><span class="rail-tooltip-key">I</span></span><span class="rail-tooltip-desc" data-desc="Notifications and updates."></span></span></button>
        <button id="rail-btn-ai" class="rail-btn"><img class="rail-icon-img" src="/assets/icons/dotbot.png" alt=""><span class="rail-tooltip"><span class="rail-tooltip-row"><span class="rail-tooltip-name">Queries</span><span class="rail-tooltip-key">Q</span></span><span class="rail-tooltip-desc" data-desc="Ask Dotbot questions about this canvas."></span></span></button>
    </div>
    <!-- Group 3: Search, outline tree, Waypoints. #search-panel (hamburger-stack.html) is a bare
         shell for now — behavior/content not yet decided, wired into the shared openRailView
         mechanism (see wireRailIcon('search', ...), panels-hamburger.js) so the icon has somewhere
         to open. -->
    <div class="rail-group rail-group-divider">
        <button id="btn-search" class="rail-btn"><img class="rail-icon-img" src="/assets/icons/search.png" alt=""><span class="rail-tooltip"><span class="rail-tooltip-row"><span class="rail-tooltip-name">Search</span><span class="rail-tooltip-key">/</span></span><span class="rail-tooltip-desc" data-desc="Search across everything on this canvas."></span></span></button>
        <button id="btn-menu" class="rail-btn"><img class="rail-icon-img" src="/assets/icons/menu-btn.png" alt=""><span class="rail-tooltip"><span class="rail-tooltip-row"><span class="rail-tooltip-name">Outline</span><span class="rail-tooltip-key">O</span></span><span class="rail-tooltip-desc" data-desc="A collapsible tree of every block on this canvas."></span></span></button>
        <button id="rail-btn-waypoints" class="rail-btn"><img class="rail-icon-img" src="/assets/icons/waypoint.png" alt=""><span class="rail-tooltip"><span class="rail-tooltip-row"><span class="rail-tooltip-name">Waypoints</span><span class="rail-tooltip-key">W</span></span><span class="rail-tooltip-desc" data-desc="Saved locations on this canvas, sorted by distance from where you are now."></span></span></button>
    </div>
    <!-- Group 4: Essentials (was Basics — renamed per explicit request; #btn-add keeps its
         internal id), Library, Marketplace. -->
    <div class="rail-group rail-group-divider">
        <button id="btn-add" class="rail-btn"><img class="rail-icon-img" src="/assets/icons/add-btn.png" alt=""><span class="rail-tooltip"><span class="rail-tooltip-row"><span class="rail-tooltip-name">Essentials</span><span class="rail-tooltip-key">E</span></span><span class="rail-tooltip-desc" data-desc="Add a note, heading, table, or other block to the canvas."></span></span></button>
        <!-- Own drafts/published/purchased items — used to be a Library tab sharing #cart-panel with
             Discover; now a fully separate rail icon/panel (see wireRailIcon('library', ...),
             marketplace.js). -->
        <button id="btn-library" class="rail-btn"><img class="rail-icon-img" src="/assets/icons/library.png" alt=""><span class="rail-tooltip"><span class="rail-tooltip-row"><span class="rail-tooltip-name">Library</span><span class="rail-tooltip-key">L</span></span><span class="rail-tooltip-desc" data-desc="Your own drafts, published items, and purchases."></span></span></button>
        <button id="btn-cart" class="rail-btn"><img class="rail-icon-img" src="/assets/icons/market-button.png" alt=""><span class="rail-tooltip"><span class="rail-tooltip-row"><span class="rail-tooltip-name">Marketplace</span><span class="rail-tooltip-key">H</span></span><span class="rail-tooltip-desc" data-desc="Discover and buy templates and canvases from other creators."></span></span></button>
    </div>
    <!-- Group 5: Friends, Collaborations, Messages. #friends-panel (hamburger-stack.html) is a
         bare shell for now — behavior/content not yet decided, wired into the shared openRailView
         mechanism (see wireRailIcon('friends', ...), panels-hamburger.js) so the icon has
         somewhere to open. friends.png doesn't exist in the repo yet — flagged the same way
         sidebar.png/dotbot.png were earlier this session. -->
    <div class="rail-group rail-group-divider">
        <button id="btn-friends" class="rail-btn"><img class="rail-icon-img" src="/assets/icons/friends.png" alt=""><span class="rail-tooltip"><span class="rail-tooltip-row"><span class="rail-tooltip-name">Friends</span><span class="rail-tooltip-key">J</span></span><span class="rail-tooltip-desc" data-desc="Manage friends and requests."></span></span></button>
        <button id="rail-btn-collab" class="rail-btn"><img class="rail-icon-img" src="/assets/icons/collaboration.png" alt=""><span class="rail-tooltip"><span class="rail-tooltip-row"><span class="rail-tooltip-name">Collaborations</span><span class="rail-tooltip-key">C</span></span><span class="rail-tooltip-desc" data-desc="People collaborating with you on this canvas."></span></span></button>
        <button id="btn-messages" class="rail-btn"><img class="rail-icon-img" src="/assets/icons/chats-btn.png" alt=""><span class="rail-tooltip"><span class="rail-tooltip-row"><span class="rail-tooltip-name">Messages</span><span class="rail-tooltip-key">M</span></span><span class="rail-tooltip-desc" data-desc="Direct messages and conversations."></span></span></button>
    </div>
    <!-- Group 6: Files, Sources, Snippets. Documents briefly existed here again (re-added after an
         earlier deletion, per a request specifying group order) but was removed again right after
         per an explicit follow-up correction, along with clarifying the intended order is Files
         first, then Sources, then Snippets — not Documents at all. Files (was ITSELF called
         Snippets, renamed to Files per an earlier explicit request — #btn-snippets/#snippets-panel
         keep their internal id, same convention as Essentials/Queries staying #btn-add/
         #rail-btn-ai under the hood) is a different button from the newer Snippets one
         (#btn-snippets2/#snippets2-panel) — the two briefly shared the same snippets.png icon (per
         explicit request at the time) until Files got its own files.png per a later explicit
         request to tell them apart. Sources/Snippets(new): #sources-panel/#snippets2-panel
         (hamburger-stack.html) are bare shells for now — behavior/content not yet decided, wired
         into the shared openRailView mechanism (see wireRailIcon('sources'/'snippets2', ...),
         panels-hamburger.js) so each icon has somewhere to open. -->
    <div class="rail-group rail-group-divider">
        <button id="btn-snippets" class="rail-btn"><img class="rail-icon-img" src="/assets/icons/files.png" alt=""><span class="rail-tooltip"><span class="rail-tooltip-row"><span class="rail-tooltip-name">Files</span><span class="rail-tooltip-key">F</span></span><span class="rail-tooltip-desc" data-desc="Files and snippets you've saved."></span></span></button>
        <button id="btn-sources" class="rail-btn"><img class="rail-icon-img" src="/assets/icons/sources.png" alt=""><span class="rail-tooltip"><span class="rail-tooltip-row"><span class="rail-tooltip-name">Sources</span><span class="rail-tooltip-key">K</span></span><span class="rail-tooltip-desc" data-desc="Structured source tables you can reference and query."></span></span></button>
        <button id="btn-snippets2" class="rail-btn"><img class="rail-icon-img" src="/assets/icons/snippets.png" alt=""><span class="rail-tooltip"><span class="rail-tooltip-row"><span class="rail-tooltip-name">Snippets</span><span class="rail-tooltip-key">S</span></span><span class="rail-tooltip-desc" data-desc="Reusable snippets you can drop onto any canvas."></span></span></button>
    </div>
    </div>
    <!-- Group 7: Settings, alone — pinned to the very bottom of the rail (#dotto-rail-middle's own
         flex:1 above already consumes the rest of the space, so nothing further is needed here to
         push this group down). The light/dark theme toggle used to be its own rail button here
         (#btn-theme-toggle) — removed per explicit request and moved into #settings-panel itself as
         a "Colour Theme" switch row instead (see its own comment, hamburger-stack.html, and
         theme-toggle.js, which now owns that switch's wiring the same way it owned the old
         button's). The \ keyboard shortcut still toggles the theme directly (srs-connections-core.js
         — toggleTheme(), theme-toggle.js) even though there's no longer a dedicated rail icon for
         it. #settings-panel is otherwise still a bare shell for the rest of its content — wired
         into the shared openRailView mechanism (see wireRailIcon('settings', ...),
         panels-hamburger.js). settings.png doesn't exist in the repo yet — flagged the same way
         friends.png was. -->
    <div class="rail-group">
        <button id="btn-settings" class="rail-btn"><img class="rail-icon-img" src="/assets/icons/settings.png" alt=""><span class="rail-tooltip"><span class="rail-tooltip-row"><span class="rail-tooltip-name">Settings</span><span class="rail-tooltip-key">Z</span></span><span class="rail-tooltip-desc" data-desc="App preferences and account settings."></span></span></button>
    </div>
</div>
<!-- Dead centre of the viewport (position:fixed, left:50% + translateX(-50%), see globals.css) —
     independent of the rail's own left offset. Back/forward (history navigation, see
     jumpToHistoryIndex, resize-shortcuts-init.js) sit in their own pill to the left of the
     compact "…/parent/current" breadcrumb (see app/dotto/BreadcrumbPill.jsx, breadcrumbMapStore),
     with the per-canvas "add a collaborator" flyout to the breadcrumb's right — all three riding
     in the same centred group rather than each picking their own position. -->
<div id="top-bar-center">
    <div class="bubble" id="nav-arrows-pill">
        <button id="btn-back" class="btn" title="Back">←</button>
        <button id="btn-forward" class="btn" title="Forward">→</button>
    </div>
    <div class="bubble" id="breadcrumb-pill"></div>
    <div class="bubble" id="collab-bubble">
        <div id="collab-content"></div>
        <div class="collab-tooltip" id="collab-tooltip"></div>
    </div>
</div>
<!-- Sits in the exact same fixed top:20px/centred slot as #top-bar-center, off-screen (slid up,
     faded out) at rest — the two swap places via one shared .notif-active class, both toggled
     together by showNotification/dismissCurrentNotification (public/dotto/stopwatch-search-
     notifications.js). Static here rather than fully React-rendered, unlike its own content
     (#notification-root, portaled into by app/dotto/NotificationBar.jsx) — the vanilla engine
     needs a stable, always-present node to toggle classes on directly. -->
<div id="notification-pill">
    <div id="notification-root"></div>
</div>
<!-- File-upload popup — U toggles it open/closed, independent of the #hamburger-stack rail-panel
     system entirely (not a railViewEls/railIconBtns entry — plain classList.toggle('open') own
     state, see upload-popup.js/core-state.js). Sits just past #dotto-rail's own right edge,
     bottom-left. Clicking #upload-popup-btn creates a blank 'media' canvas item at the current
     viewport center and immediately calls triggerMediaUpload on it (media-pdf-epub.js) — reusing
     the exact same image/video/PDF/EPUB upload flow the Media card's own "Upload" button already
     uses, rather than duplicating that FileReader/Supabase-storage logic here. -->
<div id="upload-popup">
    <button id="upload-popup-close" class="upload-popup-close" title="Close">✕</button>
    <button id="upload-popup-btn" class="upload-popup-btn">Upload a file to add it to the canvas</button>
</div>
