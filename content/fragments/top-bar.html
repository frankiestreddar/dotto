<!-- The permanent rail (#dotto-rail) replaces the old single #btn-menu button — a full-height
     strip of icons, each opening its own view inside #hamburger-stack (see openRailView,
     panels-hamburger.js) via click-only open/switch/close (no hover preview). Back/forward live in
     #top-bar-center instead (see #nav-arrows-pill below) — they're page-navigation, not
     rail-icon-style view triggers, and read better beside the breadcrumb they actually move.
     Icons are grouped into seven .rail-group wrappers (see globals.css) — a fixed 10px gap between
     buttons WITHIN a group. Group 1 (profile) is pinned to the very top, and Group 7 (the
     light/dark toggle, plus Settings below it) is pinned to the very bottom — neither one moves.
     Groups 2-6 sit inside #dotto-rail-middle, a separate flex column between the two that grows to
     fill whatever vertical space is left and centers its own children within it (justify-content:
     center) — per explicit request, replacing the old "everything just stacks at the top" layout.
     Groups 3-6 (now 2nd-5th inside that middle block) still get a dividing line between each
     consecutive pair (.rail-group-divider, the line ABOVE that group). The rail no longer expands/
     shows text labels (that feature — #btn-sidebar-toggle, #dotto-rail.expanded, .rail-label — was
     removed per explicit request); every icon is a fixed 32px square with a hover tooltip only,
     same as before that feature existed. Most icons carry TWO tooltip elements — .rail-tooltip
     (the small name+shortcut pill, unchanged, appears immediately on hover) and
     .rail-tooltip-expanded (a wider panel with the same name+shortcut on one line plus a
     description below, fading in on top of the small pill only once the hover has held for 2s —
     see its own comment, globals.css) — per explicit request. Skipped on the four cursor-mode
     buttons, whose existing tooltips are already a single longer descriptive sentence rather than
     a short name a two-line expanded panel would add much to. -->

<div id="dotto-rail">
    <!-- Group 1: profile, alone — pinned to the very top of the rail, outside
         #dotto-rail-middle's centered block below. -->
    <div class="rail-group">
        <!-- At the very top of the rail now, ahead of every panel-trigger icon — content is
             React-owned (see app/dotto/ProfileAvatarSm.jsx). Click-only open/close, same as every
             other rail icon (see wireRailIcon('profile', ...), profile-achievements-pricing.js). -->
        <button id="btn-profile" class="rail-btn">
            <div class="profile-avatar-sm" id="profile-avatar-sm"></div>
            <span class="rail-tooltip">Profile<span class="rail-tooltip-key">P</span></span>
            <span class="rail-tooltip-expanded">
                <span class="rail-tooltip-expanded-row"><span class="rail-tooltip-expanded-name">Profile</span><span class="rail-tooltip-key">P</span></span>
                <span class="rail-tooltip-expanded-desc">Your account, achievements, and pricing.</span>
            </span>
        </button>
    </div>
    <!-- Groups 2-6 (cursor-mode+Inbox+Queries, Search/Outline/Waypoints, Basics/Library/
         Marketplace, Friends/Collaborations/Messages, Snippets/Sources/Files) center as one block
         in whatever space is left between the pinned Group 1 above and the pinned Group 7 below
         (see #dotto-rail-middle, globals.css) — per explicit request. -->
    <div id="dotto-rail-middle">
    <!-- Group 2: cursor-mode selector, then Inbox, then Queries below it. The cursor-mode selector
         used to sit alone in its own group at the very bottom of the rail (group 7) — moved up here,
         above Inbox, per explicit request; it no longer expands downward on hover (there's nothing
         below it in this group to push), instead expanding rightward, overflowing past the rail's
         own edge (see #mode-toolbar, globals.css). #inbox-panel (hamburger-stack.html) is a bare
         shell for now — behavior/content not yet decided, wired into the shared openRailView
         mechanism (see wireRailIcon('inbox', ...), panels-hamburger.js) so the icon has somewhere to
         open. inbox.png doesn't exist in the repo yet — flagged the same way sidebar.png/dotbot.png
         were earlier this session. No longer needs its own bigger top gap (rail-group-gap-lg,
         dropped) now that it sits inside the centered #dotto-rail-middle block rather than directly
         under Group 1 — #dotto-rail-middle's own gap already spaces it from its siblings uniformly.
         Queries: moved here below Inbox per explicit request — was in group 6 (now Snippets/
         Sources/Files, see its own comment) — #rail-btn-ai/#ai-panel keep their internal id
         unchanged, same convention as every other rename/relocation this session. -->
    <div class="rail-group">
        <!-- Cursor-mode selector — collapsed shows only the currently active mode; hovering expands
             it (see #mode-toolbar.expanded, globals.css) rightward to reveal all four, same
             collapse/expand behavior it had as its own floating bottom-center toolbar, just living
             in the rail's own column now. -->
        <div id="mode-toolbar">
            <button class="rail-btn mode-btn mode-visible active" data-mode="normal">
                <img class="rail-icon-img" src="/assets/icons/default-cursor.png" alt="">
                <span class="rail-tooltip">Move &amp; select (default cursor) — tap Escape, hold for temporary</span>
            </button>
            <button class="rail-btn mode-btn" data-mode="data">
                <img class="rail-icon-img" src="/assets/icons/data-cursor.png" alt="">
                <span class="rail-tooltip">Data mode — drag from one card to another to link them — tap D, hold for temporary</span>
            </button>
            <button class="rail-btn mode-btn" data-mode="select">
                <img class="rail-icon-img" src="/assets/icons/select-cursor.png" alt="">
                <span class="rail-tooltip">Select mode — click or drag to select multiple cards — tap Shift, hold for temporary</span>
            </button>
            <!-- Pen mode — reworked from the old Add-menu "Drawing" toggle (setDrawMode) into a
                 real cursor mode, see applyCursorMode/handlePenPointerDown (source-buttons-cursor-
                 mode.js/srs-connections-core.js). No tap/hold keyboard shortcut yet (unlike the
                 other three) — no unclaimed single letter has an obvious mnemonic, so entering pen
                 mode is click-only for now. -->
            <button class="rail-btn mode-btn" data-mode="pen">
                <img class="rail-icon-img" src="/assets/icons/pen.png" alt="">
                <span class="rail-tooltip">Pen mode — click and drag to draw freehand, or click point by point for straight lines (Enter/Escape/double-click to finish a line)</span>
            </button>
        </div>
        <button id="btn-inbox" class="rail-btn"><img class="rail-icon-img" src="/assets/icons/inbox.png" alt=""><span class="rail-tooltip">Inbox<span class="rail-tooltip-key">I</span></span><span class="rail-tooltip-expanded"><span class="rail-tooltip-expanded-row"><span class="rail-tooltip-expanded-name">Inbox</span><span class="rail-tooltip-key">I</span></span><span class="rail-tooltip-expanded-desc">Notifications and updates.</span></span></button>
        <button id="rail-btn-ai" class="rail-btn"><img class="rail-icon-img" src="/assets/icons/dotbot.png" alt=""><span class="rail-tooltip">Queries<span class="rail-tooltip-key">Q</span></span><span class="rail-tooltip-expanded"><span class="rail-tooltip-expanded-row"><span class="rail-tooltip-expanded-name">Queries</span><span class="rail-tooltip-key">Q</span></span><span class="rail-tooltip-expanded-desc">Ask Dotbot questions about this canvas.</span></span></button>
    </div>
    <!-- Group 3: Search, outline tree, Waypoints. #search-panel (hamburger-stack.html) is a bare
         shell for now — behavior/content not yet decided, wired into the shared openRailView
         mechanism (see wireRailIcon('search', ...), panels-hamburger.js) so the icon has somewhere
         to open. -->
    <div class="rail-group rail-group-divider">
        <button id="btn-search" class="rail-btn"><img class="rail-icon-img" src="/assets/icons/search.png" alt=""><span class="rail-tooltip">Search<span class="rail-tooltip-key">/</span></span><span class="rail-tooltip-expanded"><span class="rail-tooltip-expanded-row"><span class="rail-tooltip-expanded-name">Search</span><span class="rail-tooltip-key">/</span></span><span class="rail-tooltip-expanded-desc">Search across everything on this canvas.</span></span></button>
        <button id="btn-menu" class="rail-btn"><img class="rail-icon-img" src="/assets/icons/menu-btn.png" alt=""><span class="rail-tooltip">Outline<span class="rail-tooltip-key">O</span></span><span class="rail-tooltip-expanded"><span class="rail-tooltip-expanded-row"><span class="rail-tooltip-expanded-name">Outline</span><span class="rail-tooltip-key">O</span></span><span class="rail-tooltip-expanded-desc">A collapsible tree of every block on this canvas.</span></span></button>
        <button id="rail-btn-waypoints" class="rail-btn"><img class="rail-icon-img" src="/assets/icons/waypoint.png" alt=""><span class="rail-tooltip">Waypoints<span class="rail-tooltip-key">W</span></span><span class="rail-tooltip-expanded"><span class="rail-tooltip-expanded-row"><span class="rail-tooltip-expanded-name">Waypoints</span><span class="rail-tooltip-key">W</span></span><span class="rail-tooltip-expanded-desc">Saved locations on this canvas, sorted by distance from where you are now.</span></span></button>
    </div>
    <!-- Group 4: Basics, Library, Marketplace. -->
    <div class="rail-group rail-group-divider">
        <button id="btn-add" class="rail-btn"><img class="rail-icon-img" src="/assets/icons/add-btn.png" alt=""><span class="rail-tooltip">Basics<span class="rail-tooltip-key">+</span></span><span class="rail-tooltip-expanded"><span class="rail-tooltip-expanded-row"><span class="rail-tooltip-expanded-name">Basics</span><span class="rail-tooltip-key">+</span></span><span class="rail-tooltip-expanded-desc">Add a note, heading, table, or other block to the canvas.</span></span></button>
        <!-- Own drafts/published/purchased items — used to be a Library tab sharing #cart-panel with
             Discover; now a fully separate rail icon/panel (see wireRailIcon('library', ...),
             marketplace.js). -->
        <button id="btn-library" class="rail-btn"><img class="rail-icon-img" src="/assets/icons/library.png" alt=""><span class="rail-tooltip">Library<span class="rail-tooltip-key">L</span></span><span class="rail-tooltip-expanded"><span class="rail-tooltip-expanded-row"><span class="rail-tooltip-expanded-name">Library</span><span class="rail-tooltip-key">L</span></span><span class="rail-tooltip-expanded-desc">Your own drafts, published items, and purchases.</span></span></button>
        <button id="btn-cart" class="rail-btn"><img class="rail-icon-img" src="/assets/icons/market-button.png" alt=""><span class="rail-tooltip">Marketplace<span class="rail-tooltip-key">H</span></span><span class="rail-tooltip-expanded"><span class="rail-tooltip-expanded-row"><span class="rail-tooltip-expanded-name">Marketplace</span><span class="rail-tooltip-key">H</span></span><span class="rail-tooltip-expanded-desc">Discover and buy templates and canvases from other creators.</span></span></button>
    </div>
    <!-- Group 5: Friends, Collaborations, Messages. #friends-panel (hamburger-stack.html) is a
         bare shell for now — behavior/content not yet decided, wired into the shared openRailView
         mechanism (see wireRailIcon('friends', ...), panels-hamburger.js) so the icon has
         somewhere to open. friends.png doesn't exist in the repo yet — flagged the same way
         sidebar.png/dotbot.png were earlier this session. -->
    <div class="rail-group rail-group-divider">
        <button id="btn-friends" class="rail-btn"><img class="rail-icon-img" src="/assets/icons/friends.png" alt=""><span class="rail-tooltip">Friends<span class="rail-tooltip-key">J</span></span><span class="rail-tooltip-expanded"><span class="rail-tooltip-expanded-row"><span class="rail-tooltip-expanded-name">Friends</span><span class="rail-tooltip-key">J</span></span><span class="rail-tooltip-expanded-desc">Manage friends and requests.</span></span></button>
        <button id="rail-btn-collab" class="rail-btn"><img class="rail-icon-img" src="/assets/icons/collaboration.png" alt=""><span class="rail-tooltip">Collaborations<span class="rail-tooltip-key">C</span></span><span class="rail-tooltip-expanded"><span class="rail-tooltip-expanded-row"><span class="rail-tooltip-expanded-name">Collaborations</span><span class="rail-tooltip-key">C</span></span><span class="rail-tooltip-expanded-desc">People collaborating with you on this canvas.</span></span></button>
        <button id="btn-messages" class="rail-btn"><img class="rail-icon-img" src="/assets/icons/chats-btn.png" alt=""><span class="rail-tooltip">Messages<span class="rail-tooltip-key">M</span></span><span class="rail-tooltip-expanded"><span class="rail-tooltip-expanded-row"><span class="rail-tooltip-expanded-name">Messages</span><span class="rail-tooltip-key">M</span></span><span class="rail-tooltip-expanded-desc">Direct messages and conversations.</span></span></button>
    </div>
    <!-- Group 6: Snippets, Sources, Files. Documents (which used to sit here, first) was deleted
         per explicit request; Queries then took Documents' old slot, and has now moved on again to
         group 2 below Inbox (see its own comment there) per a later explicit request, leaving this
         first slot empty for the new Snippets button below. Files (was ITSELF called Snippets,
         renamed to Files per an earlier explicit request — #btn-snippets/#snippets-panel keep
         their internal id, same convention as Basics/Queries staying #btn-add/#rail-btn-ai under
         the hood) is a different button from this new Snippets one — per explicit request this new
         one reuses the same snippets.png icon Files used to be the sole user of, so the two now
         look identical; that's what was asked for, not an oversight. #btn-snippets2/
         #snippets2-panel is this new button's own id, distinct from Files' #btn-snippets/
         #snippets-panel. Sources/Snippets(new)/Files: #sources-panel/#snippets2-panel/
         #snippets-panel (hamburger-stack.html) are bare shells for now — behavior/content not yet
         decided, wired into the shared openRailView mechanism (see
         wireRailIcon('sources'/'snippets2'/'snippets', ...), panels-hamburger.js) so each icon has
         somewhere to open. -->
    <div class="rail-group rail-group-divider">
        <button id="btn-snippets2" class="rail-btn"><img class="rail-icon-img" src="/assets/icons/snippets.png" alt=""><span class="rail-tooltip">Snippets<span class="rail-tooltip-key">S</span></span><span class="rail-tooltip-expanded"><span class="rail-tooltip-expanded-row"><span class="rail-tooltip-expanded-name">Snippets</span><span class="rail-tooltip-key">S</span></span><span class="rail-tooltip-expanded-desc">Reusable snippets you can drop onto any canvas.</span></span></button>
        <button id="btn-sources" class="rail-btn"><img class="rail-icon-img" src="/assets/icons/sources.png" alt=""><span class="rail-tooltip">Sources<span class="rail-tooltip-key">K</span></span><span class="rail-tooltip-expanded"><span class="rail-tooltip-expanded-row"><span class="rail-tooltip-expanded-name">Sources</span><span class="rail-tooltip-key">K</span></span><span class="rail-tooltip-expanded-desc">Structured source tables you can reference and query.</span></span></button>
        <button id="btn-snippets" class="rail-btn"><img class="rail-icon-img" src="/assets/icons/snippets.png" alt=""><span class="rail-tooltip">Files<span class="rail-tooltip-key">F</span></span><span class="rail-tooltip-expanded"><span class="rail-tooltip-expanded-row"><span class="rail-tooltip-expanded-name">Files</span><span class="rail-tooltip-key">F</span></span><span class="rail-tooltip-expanded-desc">Files and snippets you've saved.</span></span></button>
    </div>
    </div>
    <!-- Group 7: light/dark theme toggle, then Settings below it — pinned to the very bottom of
         the rail (#dotto-rail-middle's own flex:1 above already consumes the rest of the space, so
         nothing further is needed here to push this group down). #settings-panel
         (hamburger-stack.html) is a bare shell for now, same as Friends when it was first added —
         behavior/content not yet decided, wired into the shared openRailView mechanism (see
         wireRailIcon('settings', ...), panels-hamburger.js). settings.png doesn't exist in the
         repo yet — flagged the same way friends.png was. -->
    <div class="rail-group">
        <!-- Icon shows the theme clicking it would SWITCH TO (light.png here since dark is the
             app's default, per explicit request — see theme-toggle.js, which swaps it to dark.png
             once light mode is active), not the currently-active one. Tooltip text ("Light
             mode"/"Dark mode") is kept in sync with the icon by the same module. Wiring (click
             handler, localStorage persistence, icon+tooltip sync) all lives in theme-toggle.js —
             this button isn't routed through openRailView/wireRailIcon since it doesn't open a
             panel. -->
        <!-- rail-tooltip-expanded's own name/desc are kept in sync with the icon/small-pill's
             "Light mode"/"Dark mode" swap by the same theme-toggle.js code that already does it for
             the small pill (see its own comment) — .rail-tooltip-expanded-name here is just the
             initial dark-mode-default text, same as the small pill's own default. -->
        <button id="btn-theme-toggle" class="rail-btn"><img class="rail-icon-img" src="/assets/icons/light.png" alt=""><span class="rail-tooltip">Light mode<span class="rail-tooltip-key">\</span></span><span class="rail-tooltip-expanded"><span class="rail-tooltip-expanded-row"><span class="rail-tooltip-expanded-name">Light mode</span><span class="rail-tooltip-key">\</span></span><span class="rail-tooltip-expanded-desc">Switch between light and dark mode.</span></span></button>
        <button id="btn-settings" class="rail-btn"><img class="rail-icon-img" src="/assets/icons/settings.png" alt=""><span class="rail-tooltip">Settings</span><span class="rail-tooltip-expanded"><span class="rail-tooltip-expanded-row"><span class="rail-tooltip-expanded-name">Settings</span></span><span class="rail-tooltip-expanded-desc">App preferences and account settings.</span></span></button>
    </div>
</div>
<!-- Dead centre of the viewport (position:fixed, left:50% + translateX(-50%), see globals.css) —
     independent of the rail's own left offset. Back/forward (history navigation, see
     jumpToHistoryIndex, resize-shortcuts-init.js) sit in their own pill to the left of the
     compact "…/parent/current" breadcrumb (see app/dotto/BreadcrumbPill.jsx, breadcrumbMapStore),
     with the per-canvas "add a collaborator" flyout to the breadcrumb's right — all three riding
     in the same centred group rather than each picking their own position. -->
<div id="top-bar-center">
    <div class="bubble" id="nav-arrows-pill">
        <button id="btn-back" class="btn" title="Back">←</button>
        <button id="btn-forward" class="btn" title="Forward">→</button>
    </div>
    <div class="bubble" id="breadcrumb-pill"></div>
    <div class="bubble" id="collab-bubble">
        <div id="collab-content"></div>
        <div class="collab-tooltip" id="collab-tooltip"></div>
    </div>
</div>
<!-- Sits in the exact same fixed top:20px/centred slot as #top-bar-center, off-screen (slid up,
     faded out) at rest — the two swap places via one shared .notif-active class, both toggled
     together by showNotification/dismissCurrentNotification (public/dotto/stopwatch-search-
     notifications.js). Static here rather than fully React-rendered, unlike its own content
     (#notification-root, portaled into by app/dotto/NotificationBar.jsx) — the vanilla engine
     needs a stable, always-present node to toggle classes on directly. -->
<div id="notification-pill">
    <div id="notification-root"></div>
</div>
<!-- File-upload popup — U toggles it open/closed, independent of the #hamburger-stack rail-panel
     system entirely (not a railViewEls/railIconBtns entry — plain classList.toggle('open') own
     state, see upload-popup.js/core-state.js). Sits just past #dotto-rail's own right edge,
     bottom-left. Clicking #upload-popup-btn creates a blank 'media' canvas item at the current
     viewport center and immediately calls triggerMediaUpload on it (media-pdf-epub.js) — reusing
     the exact same image/video/PDF/EPUB upload flow the Media card's own "Upload" button already
     uses, rather than duplicating that FileReader/Supabase-storage logic here. -->
<div id="upload-popup">
    <button id="upload-popup-close" class="upload-popup-close" title="Close">✕</button>
    <button id="upload-popup-btn" class="upload-popup-btn">Upload a file to add it to the canvas</button>
</div>
